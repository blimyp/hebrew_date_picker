name: hebrew_date_picker
description: "A Material-style date picker that shows the Hebrew (Jewish) date in every day cell, the Hebrew months in the month title and the full Hebrew date of the selected day."
version: 0.3.0
repository: https://github.com/blimyp/hebrew_date_picker
issue_tracker: https://github.com/blimyp/hebrew_date_picker/issues
topics:
  - calendar
  - date-picker
  - hebrew
  - jewish-calendar
  - widget
screenshots:
  - description: "The date picker, showing the Hebrew date in every day cell."
    path: screenshots/hebrew_date_picker.png
  - description: "The date range picker, showing the Hebrew dates of the selected range."
    path: screenshots/hebrew_date_range_picker.png

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ">=0.18.0 <0.21.0"
  kosher_dart: ^2.0.20
  table_calendar: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
